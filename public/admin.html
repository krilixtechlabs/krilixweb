<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krilix Admin</title>

  <style>
  :root {
    --black: #070707;
    --black2: #11100d;
    --gold: #b88a35;
    --gold2: #e7c879;
    --text: #f7f1e6;
    --muted: #a99f90;
    --line: rgba(255,255,255,.12);
    --panel: rgba(255,255,255,.035);
    --panel-2: rgba(255,255,255,.05);
    --success: #9ae6b4;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--black);
    color: var(--text);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 0%, rgba(184,138,53,.18), transparent 420px),
      linear-gradient(90deg, transparent 0, transparent calc(25% - 1px), rgba(255,255,255,.03) 25%, transparent calc(25% + 1px)),
      linear-gradient(90deg, transparent 0, transparent calc(50% - 1px), rgba(255,255,255,.03) 50%, transparent calc(50% + 1px)),
      linear-gradient(90deg, transparent 0, transparent calc(75% - 1px), rgba(255,255,255,.03) 75%, transparent calc(75% + 1px));
    z-index: -1;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .wrap {
    width: min(1180px, calc(100% - 40px));
    margin: 0 auto;
  }

  header {
    border-bottom: 1px solid var(--line);
    background: rgba(7,7,7,.84);
    backdrop-filter: blur(16px);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  nav {
    min-height: 84px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .brand strong {
    font-size: 14px;
    letter-spacing: .34em;
    line-height: 1;
  }

  .brand span {
    color: var(--gold2);
    font-size: 11px;
    letter-spacing: .26em;
    font-weight: 800;
    text-transform: uppercase;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 20px;
    border: 1px solid rgba(255,255,255,.16);
    background: transparent;
    color: var(--text);
    font-weight: 800;
    cursor: pointer;
    transition: .2s ease;
  }

  .btn:hover {
    border-color: var(--gold2);
    color: var(--gold2);
    transform: translateY(-1px);
  }

  .btn.gold {
    background: #f4efe5;
    color: #111;
    border-color: #f4efe5;
  }

  .btn.gold:hover {
    background: var(--gold2);
    border-color: var(--gold2);
    color: #111;
  }

  main {
    padding: 56px 0 80px;
  }

  .hero {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 28px;
    align-items: end;
    margin-bottom: 34px;
  }

  .eyebrow {
    margin: 0 0 16px;
    color: var(--gold2);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .28em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(44px, 6vw, 78px);
    line-height: .92;
    letter-spacing: -.05em;
    font-weight: 500;
  }

  .hero p {
    margin: 18px 0 0;
    max-width: 760px;
    color: var(--muted);
    font-size: 18px;
    line-height: 1.7;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    padding: 22px 22px 18px;
    border: 1px solid var(--line);
    background: var(--panel);
  }

  .stat-card small {
    display: block;
    color: var(--gold2);
    font-size: 11px;
    letter-spacing: .24em;
    text-transform: uppercase;
    margin-bottom: 12px;
    font-weight: 900;
  }

  .stat-card strong {
    font-size: 34px;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 500;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
  }

  .toolbar h2 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
  }

  .toolbar-right {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .messages {
    display: grid;
    gap: 16px;
  }

  .message-card {
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.02));
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 18px;
  }

  .message-top {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 18px;
    align-items: center;
    margin-bottom: 12px;
  }

  .message-name {
    font-size: 34px;
    font-family: Georgia, "Times New Roman", serif;
    line-height: .95;
    letter-spacing: -.04em;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    min-height: 32px;
    padding: 0 12px;
    border: 1px solid rgba(154,230,180,.36);
    color: var(--success);
    background: rgba(154,230,180,.08);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .badge.new {
    color: var(--gold2);
    border-color: rgba(231,200,121,.36);
    background: rgba(231,200,121,.08);
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 14px;
  }

  .preview {
    margin: 0;
    color: #ddd5c7;
    line-height: 1.7;
    max-width: 760px;
  }

  .message-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
    min-width: 220px;
  }

  .message-actions .btn {
    width: 100%;
  }

  .empty {
    padding: 28px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
  }

  .btn.danger {
  border-color: rgba(255, 120, 120, 0.28);
  color: #ffb4b4;
  background: rgba(255, 90, 90, 0.05);
}

.btn.danger:hover {
  border-color: rgba(255, 120, 120, 0.55);
  color: #fff;
  background: rgba(255, 90, 90, 0.14);
}

.message-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  justify-content: center;
  min-width: 220px;
}

.message-actions .btn {
  width: 100%;
}

  @media (max-width: 900px) {
    .hero,
    .message-card {
      grid-template-columns: 1fr;
    }

    .stats {
      grid-template-columns: 1fr;
    }

    .message-actions {
      min-width: 0;
    }

    .message-actions .btn {
      width: 100%;
    }
  }
</style>
</head>

<body>
  <header>
    <nav class="wrap">
      <div class="brand">
        <strong>KRILIX</strong>
        <span>Admin</span>
      </div>

      <button class="btn" id="logoutBtn">Kilépés</button>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <div>
        <p class="eyebrow">Krilix Admin</p>
        <h1>Beérkezett megkeresések.</h1>
        <p>
          Itt látod az oldalról érkező érdeklődéseket. Az adminban most csak a lényeg
          jelenik meg: összefoglaló, státusz és gyors belépés a privát beszélgetésbe.
        </p>
      </div>

      <div>
        <button class="btn gold" id="refreshBtn">Frissítés</button>
      </div>
    </section>

    <section class="stats" id="stats"></section>

    <section>
      <div class="toolbar">
        <h2>Megkeresések listája</h2>

        <div class="toolbar-right">
          <span id="messageCount"></span>
        </div>
      </div>

      <div class="messages" id="messages"></div>
    </section>
  </main>


  <script>
  const messagesEl = document.getElementById("messages");
  const statsEl = document.getElementById("stats");
  const refreshBtn = document.getElementById("refreshBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const messageCountEl = document.getElementById("messageCount");

  async function loadMessages() {
    try {
      const response = await fetch("/api/admin/messages", {
        credentials: "include"
      });

      if (response.status === 401) {
        window.location.href = "/admin-login.html";
        return;
      }

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(data.error || "Nem sikerült betölteni az üzeneteket.");
      }

      renderStats(data.messages || []);
      renderMessages(data.messages || []);
    } catch (error) {
      console.error(error);
      messagesEl.innerHTML = `<div class="empty">Nem sikerült betölteni a megkereséseket.</div>`;
      statsEl.innerHTML = "";
      messageCountEl.textContent = "";
    }
  }

  function renderStats(messages) {
    const total = messages.length;
    const replied = messages.filter(item => item.status === "replied").length;
    const fresh = total - replied;

    statsEl.innerHTML = `
      <article class="stat-card">
        <small>Összes</small>
        <strong>${total}</strong>
      </article>

      <article class="stat-card">
        <small>Új</small>
        <strong>${fresh}</strong>
      </article>

      <article class="stat-card">
        <small>Megválaszolt</small>
        <strong>${replied}</strong>
      </article>
    `;
  }

  function formatDate(dateString) {
    if (!dateString) return "—";

    const date = new Date(dateString);

    return date.toLocaleString("hu-HU", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function escapeHtml(text = "") {
    return text
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getPreview(item) {
    if (item.message && item.message.trim()) {
      return item.message.trim();
    }

    if (item.conversation && item.conversation.length) {
      const last = item.conversation[item.conversation.length - 1];
      if (last?.message) return last.message.trim();
    }

    return "Nincs előnézet.";
  }

  function truncate(text, max = 140) {
    if (!text) return "";
    return text.length > max ? text.slice(0, max).trim() + "..." : text;
  }

  function renderMessages(messages) {
    messageCountEl.textContent = `${messages.length} db megkeresés`;

    if (!messages.length) {
      messagesEl.innerHTML = `<div class="empty">Még nincs beérkezett megkeresés.</div>`;
      return;
    }

    messagesEl.innerHTML = messages.map(item => {
      const preview = truncate(getPreview(item), 140);
      const isReplied = item.status === "replied";

      return `
        <article class="message-card">
          <div>
            <div class="message-top">
              <div class="message-name">${escapeHtml(item.name || "Névtelen")}</div>
              <div class="badge ${isReplied ? "" : "new"}">
                ${isReplied ? "Megválaszolva" : "Új"}
              </div>
            </div>

            <div class="meta">
              <span>#${item.id}</span>
              <span>${escapeHtml(item.email || "—")}</span>
              <span>${formatDate(item.created_at)}</span>
            </div>

            <p class="preview">${escapeHtml(preview)}</p>
          </div>

          <div class="message-actions">
            <a class="btn gold" href="/thread/${item.thread_token}?admin=1" target="_blank" rel="noopener">
                Beszélgetés megnyitása
            </a>

            <a class="btn" href="mailto:${escapeHtml(item.email || "")}">
                Email megnyitása
            </a>

            <button class="btn danger" onclick='deleteMessage(${item.id}, ${JSON.stringify(item.name || "Névtelen")})'>
                Megkeresés törlése
            </button>
            </div>
        </article>
      `;
    }).join("");
  }

  async function logout() {
    try {
      await fetch("/api/admin/logout", {
        method: "POST",
        credentials: "include"
      });
    } catch (error) {
      console.error(error);
    }

    window.location.href = "/admin-login.html";
  }

  refreshBtn.addEventListener("click", loadMessages);
  logoutBtn.addEventListener("click", logout);

  loadMessages();
</script>
</body>
</html>
