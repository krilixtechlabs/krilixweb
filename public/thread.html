<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krilix beszélgetés</title>

  <style>
    :root {
      --black: #070707;
      --black2: #11100d;
      --cream: #f4efe5;
      --gold: #b88a35;
      --gold2: #e7c879;
      --text: #f7f1e6;
      --muted: #a99f90;
      --line: rgba(231, 200, 121, .18);
      --danger: #ff9b9b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(184,138,53,.20), transparent 420px),
        var(--black);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    textarea {
      font: inherit;
    }

    .wrap {
      width: min(920px, calc(100% - 36px));
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(7,7,7,.78);
      backdrop-filter: blur(18px);
    }

    nav {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand strong {
      display: block;
      font-size: 14px;
      letter-spacing: .34em;
    }

    .brand span {
      display: block;
      margin-top: 7px;
      color: var(--gold2);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .hero {
      padding: 56px 0 30px;
    }

    .label {
      margin: 0 0 16px;
      color: var(--gold2);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 7vw, 78px);
      line-height: .9;
      letter-spacing: -.06em;
      font-weight: 500;
    }

    .lead {
      margin: 22px 0 0;
      max-width: 620px;
      color: var(--muted);
      line-height: 1.75;
      font-size: 17px;
    }

    .panel {
      margin: 26px 0 70px;
      border: 1px solid var(--line);
      background:
        linear-gradient(145deg, rgba(255,255,255,.065), rgba(255,255,255,.025)),
        #111;
      padding: 26px;
      box-shadow: 0 38px 130px rgba(0,0,0,.42);
    }

    .chat {
      display: grid;
      gap: 14px;
    }

    .bubble {
      max-width: 78%;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.045);
      color: #e8dfcf;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .bubble.admin {
      margin-left: auto;
      background: rgba(231,200,121,.10);
      border-color: rgba(231,200,121,.24);
    }

    .bubble small {
      display: block;
      margin-bottom: 8px;
      color: var(--gold2);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 900;
    }

    .reply {
      margin-top: 26px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.055);
      color: var(--text);
      padding: 14px;
      outline: none;
      border-radius: 0;
      line-height: 1.6;
    }

    textarea:focus {
      border-color: var(--gold2);
      background: rgba(255,255,255,.08);
    }

    .btn {
      margin-top: 14px;
      min-height: 50px;
      padding: 0 24px;
      border: 1px solid var(--cream);
      background: var(--cream);
      color: var(--black);
      font-weight: 900;
      cursor: pointer;
      transition: .2s ease;
    }

    .btn:hover {
      background: var(--gold2);
      border-color: var(--gold2);
      transform: translateY(-1px);
    }

    .note {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .note.error {
      color: var(--danger);
    }

    .note.success {
      color: var(--gold2);
    }

    .empty {
      border: 1px solid var(--line);
      padding: 28px;
      color: var(--muted);
      background: rgba(255,255,255,.035);
    }

    @media (max-width: 640px) {
      .bubble {
        max-width: 100%;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav class="wrap">
      <div class="brand">
        <strong>KRILIX</strong>
        <span>Beszélgetés</span>
      </div>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="label">Privát beszélgetés</p>
      <h1>Egyeztetés a megkeresésedről.</h1>
      <p class="lead" id="lead">
        Itt tudod folytatni a beszélgetést a Krilix Tech & Labs csapatával.
      </p>
    </section>

    <section class="panel">
      <div id="chat" class="chat">
        <div class="empty">Beszélgetés betöltése...</div>
      </div>

      <form class="reply" id="replyForm">
        <p class="label">Új üzenet</p>
        <textarea id="message" placeholder="Írd meg a válaszod..." required></textarea>
        <button class="btn" type="submit">Üzenet küldése</button>
        <p class="note" id="note"></p>
      </form>
    </section>
  </main>

  <script>
    const token = window.location.pathname.split("/").filter(Boolean).pop();
    const chatEl = document.getElementById("chat");
    const leadEl = document.getElementById("lead");
    const replyForm = document.getElementById("replyForm");
    const messageInput = document.getElementById("message");
    const note = document.getElementById("note");

    loadThread();

    replyForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const message = messageInput.value.trim();
      const button = replyForm.querySelector("button");

      if (!message) {
        setNote("Írj üzenetet küldés előtt.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Küldés...";
      setNote("Üzenet küldése folyamatban...");

      try {
        const response = await fetch(`/api/thread/${token}/reply`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.error || "Nem sikerült elküldeni.");
        }

        messageInput.value = "";
        setNote("Üzenet elküldve.", "success");
        await loadThread();
      } catch (error) {
        setNote(error.message, "error");
      } finally {
        button.disabled = false;
        button.textContent = "Üzenet küldése";
      }
    });

    async function loadThread() {
      try {
        const response = await fetch(`/api/thread/${token}`);
        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.error || "Nem sikerült betölteni.");
        }

        leadEl.textContent = `${result.contact.name}, itt tudod folytatni a beszélgetést a Krilix Tech & Labs csapatával.`;

        renderMessages(result.messages);
      } catch (error) {
        chatEl.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
        replyForm.style.display = "none";
      }
    }

    function renderMessages(messages) {
      if (!messages.length) {
        chatEl.innerHTML = `<div class="empty">Még nincs üzenet ebben a beszélgetésben.</div>`;
        return;
      }

      chatEl.innerHTML = messages.map((item) => {
        const senderLabel = item.sender === "admin" ? "Krilix" : "Te";
        const time = new Date(item.created_at).toLocaleString("hu-HU");
        const bubbleClass = item.sender === "admin" ? "bubble admin" : "bubble";

        return `
          <div class="${bubbleClass}">
            <small>${senderLabel} · ${time}</small>
            ${escapeHtml(item.message)}
          </div>
        `;
      }).join("");
    }

    function setNote(text, type) {
      note.textContent = text;
      note.className = "note";

      if (type) {
        note.classList.add(type);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
